// --- Image Configuration Engine ---
const IMAGE_CONFIG = {
  maxWidth: 800,       // Maximum width in pixels for the resized image
  quality: 0.75,       // 0.0 to 1.0 (JPEG Quality)
  maxInputSizeMB: 10,  // Limit input file size before processing
  outputFormat: 'image/jpeg'
};

/**
 * Reusable Image Compression Utility
 * @param {File} file - The browser File object
 * @returns {Promise<string>} - Resolves with Base64 data string
 */
const compressImage = (file) => {
  return new Promise((resolve, reject) => {
    if (!file) return reject("No file provided");
    
    const reader = new FileReader();
    reader.readAsDataURL(file);
    
    reader.onload = (event) => {
      const img = new Image();
      img.src = event.target.result;
      
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        if (width > IMAGE_CONFIG.maxWidth) {
          height *= IMAGE_CONFIG.maxWidth / width;
          width = IMAGE_CONFIG.maxWidth;
        }

        canvas.width = width;
        canvas.height = height;
        
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const dataUrl = canvas.toDataURL(IMAGE_CONFIG.outputFormat, IMAGE_CONFIG.quality);
        resolve(dataUrl);
      };
      
      img.onerror = (err) => reject("Image load failed: " + err);
    };
    
    reader.onerror = (err) => reject("File read failed: " + err);
  });
};

  useEffect(() => {
    const handleClickOutside = (event) => {
      if (menuRef.current && !menuRef.current.contains(event.target)) {
        setIsMenuOpen(false);
      }
    };
    document.addEventListener('mousedown', handleClickOutside);
    return () => {
      document.removeEventListener('mousedown', handleClickOutside);
    };

  const handleEdit = (e) => {
    e.stopPropagation(); // Prevent modal from opening
    setEditingRecipe(recipe);
    setIsMenuOpen(false);
  };

  const handleDelete = (e) => {
    e.stopPropagation(); // Prevent modal from opening
    // Note: handleDeleteRecipe handles confirmation internally
    handleDeleteRecipe(recipe.id, recipe.name);
    setIsMenuOpen(false);

// --- Main App Component ---
function App() {
  const [db, setDb] = useState(null);
  const [auth, setAuth] = useState(null);
  const [userId, setUserId] = useState(null);
  const [recipes, setRecipes] = useState([]);
  const [favoriteRecipeIds, setFavoriteRecipeIds] = useState(new Set()); // Corrected initialization
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [isAuthReady, setIsAuthReady] = useState(false);
  
  // Form State
  const [isFormVisible, setIsFormVisible] = useState(false);
  const [isDebugMenuOpen, setIsDebugMenuOpen] = useState(false); // Controls the new DebugScreen
  const [newRecipe, setNewRecipe] = useState(initialFormState);
  const [editingRecipe, setEditingRecipe] = useState(null); // Holds recipe object if editing
  const [selectedRecipe, setSelectedRecipe] = useState(null); // Holds recipe for detail modal
  
  // Filtering & Search
  const [filterBrand, setFilterBrand] = useState('All');
  const [searchTerm, setSearchTerm] = useState('');
  
  const [isProcessingImage, setIsProcessingImage] = useState(false);
  const fileInputRef = useRef(null); // Reference for the file input DOM element

  // --- Utility for showing non-blocking errors ---
  const showCustomError = (message) => {
    setError(message);
    setTimeout(() => setError(null), 5000);
  }

  // --- 1. Firebase Initialization and Authentication ---
  useEffect(() => {
    if (!Object.keys(firebaseConfig).length) {
      setError("Firebase config is missing.");
      setLoading(false);
      setIsAuthReady(true);
      return;
    }

    try {
      const app = initializeApp(firebaseConfig);
      const firestoreDb = getFirestore(app);
      const firebaseAuth = getAuth(app);
      setDb(firestoreDb);
      setAuth(firebaseAuth);

      const unsubscribe = onAuthStateChanged(firebaseAuth, async (user) => {
        if (!user) {
          
          // --- BEGIN AUTH RETRY LOGIC ---
          const MAX_RETRIES = 5;
          for (let attempt = 0; attempt < MAX_RETRIES; attempt++) {
            try {
              if (initialAuthToken) {
                const userCredential = await signInWithCustomToken(firebaseAuth, initialAuthToken);
                setUserId(userCredential.user.uid);
              } else {
                const userCredential = await signInAnonymously(firebaseAuth);
                setUserId(userCredential.user.uid);
              }
              // If successful, break the loop
              break; 
            } catch (authError) {
              if (attempt < MAX_RETRIES - 1) {
                // Exponential backoff: wait for 2^attempt * 500ms
                const delay = Math.pow(2, attempt) * 500;
                await new Promise(resolve => setTimeout(resolve, delay));
              } else {
                // Final attempt failed
                console.error("Firebase Auth Error (Max Retries Exceeded):", authError);
                setError("Authentication failed after multiple attempts.");
              }
            }
          }
          // --- END AUTH RETRY LOGIC ---
          
        } else {
          setUserId(user.uid);
        }
        setLoading(false);
        setIsAuthReady(true);
      });
      return () => unsubscribe();
    } catch (e) {
      console.error("Init Error:", e);
      setError("Initialization failed.");
      setLoading(false);
      setIsAuthReady(true);
    }
  }, []);

  // --- 2. Real-time Listener for Public Recipes (Includes Endorser IDs) ---
  useEffect(() => {
    if (!db || !isAuthReady) return;
    const q = query(collection(db, RECIPES_COLLECTION_PATH));
    const unsubscribe = onSnapshot(q, (snapshot) => {
      const fetchedRecipes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      setRecipes(fetchedRecipes);
    }, (snapError) => {
      console.error("Snapshot Error (Public Recipes):", snapError);
      // Removed the error display here as it's secondary to auth failure
    });
    return () => unsubscribe();
  }, [db, isAuthReady]); 

  // --- 3. Real-time Listener for User's Private Favorites ---
  useEffect(() => {
    if (!db || !isAuthReady || !userId) return;

    // Path: /artifacts/{appId}/users/{userId}/favorites
    const FAVORITES_COLLECTION_PATH = `artifacts/${appId}/users/${userId}/favorites`;
    const q = query(collection(db, FAVORITES_COLLECTION_PATH));
    
    const unsubscribe = onSnapshot(q, (snapshot) => {
      // Map documents to a Set for quick O(1) lookup in RecipeCard
      const favoriteIds = new Set(snapshot.docs.map(doc => doc.id));
      setFavoriteRecipeIds(favoriteIds);
    }, (snapError) => {
      console.error("Snapshot Error (Private Favorites):", snapError);
    });
    
    return () => unsubscribe();
  }, [db, isAuthReady, userId]);

  // --- 4. Core Logic for Interactions ---

  const toggleFavorite = async (recipeId, isFavorite) => {
    if (!db || !userId) {
      showCustomError("Authentication required to save favorites.");
      return;
    }
    
    // Path: /artifacts/{appId}/users/{userId}/favorites/{recipeId}
    const favoriteDocRef = doc(db, `artifacts/${appId}/users/${userId}/favorites`, recipeId);

    try {
        if (isFavorite) {
            await deleteDoc(favoriteDocRef);
        } else {
            await setDoc(favoriteDocRef, { 
                favoritedAt: serverTimestamp(),
                recipeId: recipeId
            });
        }
    } catch (err) {
        console.error("Toggle Favorite Error:", err);
        showCustomError("Failed to update favorite status.");
    }
  };

  const toggleEndorsement = async (recipeId, isEndorsed) => {
    if (!db || !userId) {
      showCustomError("Authentication required to endorse recipes.");
      return;
    }

    // Path: /artifacts/{appId}/public/data/cameraRecipes/{recipeId}
    const recipeDocRef = doc(db, RECIPES_COLLECTION_PATH, recipeId);

    try {
        if (isEndorsed) {
            await updateDoc(recipeDocRef, {
                endorserIds: arrayRemove(userId)
            });
        } else {
            await updateDoc(recipeDocRef, {
                endorserIds: arrayUnion(userId) 
            });
        }
    } catch (err) {
        console.error("Toggle Endorsement Error:", err);
        showCustomError("Failed to update endorsement status.");
    }
  };
  
  const handleDeleteRecipe = async (recipeId, recipeName) => {
    if (!db || !userId) {
        showCustomError("Authentication required to delete recipes.");
        return;
    }

    const confirmed = window.confirm(`Are you sure you want to delete the recipe: "${recipeName}"? This action cannot be undone.`);

    if (confirmed) {
        try {
            const recipeToDelete = recipes.find(r => r.id === recipeId);
            if (!recipeToDelete || recipeToDelete.userId !== userId) {
                showCustomError("You can only delete your own recipes.");
                return;
            }

            const recipeDocRef = doc(db, RECIPES_COLLECTION_PATH, recipeId);
            await deleteDoc(recipeDocRef);
            showCustomError(`Recipe "${recipeName}" deleted successfully.`);
        } catch (err) {
            console.error("Delete Error:", err);
            showCustomError("Failed to delete recipe.");
        }
    }
  };

  const handleDeleteAllRecipes = async () => {
    if (!db || !userId) {
        showCustomError("App not ready or authentication failed.");
        return;
    }

    const confirmed = window.confirm("!!! DANGER ZONE !!!\n\nAre you absolutely sure you want to delete ALL recipes? This will wipe the public collection and cannot be undone.");

    if (confirmed) {
        try {
            const recipeCollectionRef = collection(db, RECIPES_COLLECTION_PATH);
            const snapshot = await getDocs(recipeCollectionRef);
            
            const batch = writeBatch(db);
            let deleteCount = 0;

            snapshot.docs.forEach((document) => {
                batch.delete(document.ref);
                deleteCount++;
            });

            await batch.commit();
            showCustomError(`${deleteCount} recipes deleted successfully.`);
            setIsDebugMenuOpen(false); // Close menu on success
        } catch (err) {
            console.error("Delete All Error:", err);
            showCustomError("Failed to delete all recipes.");
        }
    }
  }


  // --- 5. Filtering and Searching ---
  const filteredRecipes = useMemo(() => {
    let list = recipes;
    if (filterBrand !== 'All') list = list.filter(recipe => recipe.brand === filterBrand);
    
    // If filtering by favorites, only show recipes whose IDs are in the set
    if (filterBrand === 'Favorites' && favoriteRecipeIds && favoriteRecipeIds.size > 0) {
        list = list.filter(recipe => favoriteRecipeIds.has(recipe.id));
    } else if (filterBrand === 'Favorites') {
        list = []; 
    }

    if (searchTerm) {
      const lower = searchTerm.toLowerCase();
      list = list.filter(r => 
        r.name && r.name.toLowerCase().includes(lower) || 
        r.model && r.model.toLowerCase().includes(lower) || 
        r.baseProfile && r.baseProfile.toLowerCase().includes(lower)
      );
    }
    // Sort by endorsement count (descending) then by timestamp
    return list.sort((a, b) => {
        const endorserA = a.endorserIds && a.endorserIds.length || 0;
        const endorserB = b.endorserIds && b.endorserIds.length || 0;
        if (endorserB !== endorserA) return endorserB - endorserA;
        return (b.timestamp && b.timestamp.seconds || 0) - (a.timestamp && a.timestamp.seconds || 0);
    });
  }, [recipes, filterBrand, searchTerm, favoriteRecipeIds]);

  // --- 6. Form Handlers ---
  const handleInputChange = (e) => {
    const { name, value } = e.target;
    // Determine which state setter to use
    const setter = editingRecipe ? setEditingRecipe : setNewRecipe;
    setter(prev => ({ ...prev, [name]: value }));
  };

  const handleBrandChange = (e) => {
    const { name, value } = e.target;
    const setter = editingRecipe ? setEditingRecipe : setNewRecipe;

    setter(prev => {
        const models = BRAND_MODELS[value] || [];
        const newModel = models.length > 0 ? models[0] : '';
        const newBaseProfile = BRAND_MODELS[value] && BASE_PROFILES_BY_BRAND[value][0] || '';

        return { 
            ...prev, 
            [name]: value, 
            model: newModel,
            baseProfile: newBaseProfile,
            // Reset all other parameters on brand switch (important for cleaner data)
            ...CORE_PARAMS_MAP.filter(p => p.key !== 'baseProfile').reduce((acc, param) => ({ ...acc, [param.key]: '' }), {}),
        };
    });
  };
  
  // NOTE: Now accepts the fileInputRef
  const handleImageUpload = async (e, inputRef) => {
    // 1. Capture file
    const file = e.target.files[0];
    
    if (!file) return;

    // CRITICAL: Reset the DOM input value immediately after capture. This is key.
    if (inputRef.current) {
        inputRef.current.value = null; 
    }

    if (file.size > IMAGE_CONFIG.maxInputSizeMB * 1024 * 1024) {
      showCustomError('File too large. Limit is ' + IMAGE_CONFIG.maxInputSizeMB + 'MB.');
      return;
    }

    setIsProcessingImage(true);

    try {
      const compressedDataUrl = await compressImage(file);
      
      const setter = editingRecipe ? setEditingRecipe : setNewRecipe;
      setter(prev => ({ ...prev, imageUrl: compressedDataUrl }));
      
      setIsProcessingImage(false);
    } catch (err) {
      console.error('Compression Failed:', err);
      showCustomError('Failed to process image. It might be corrupt.');
      setIsProcessingImage(false);
    }
  };

  // Note: This function is called from RecipeForm.
  const clearImage = () => {
    const setter = editingRecipe ? setEditingRecipe : setNewRecipe;
    setter(prev => ({ ...prev, imageUrl: '' }));
    // The form component handles clearing the DOM input value via the ref.
  };
  
  const resetFormState = () => {
    setNewRecipe(initialFormState);
    setEditingRecipe(null);
    setIsFormVisible(false);
  }

  const handleFormSubmit = async (e) => {
    e.preventDefault();

    if (!db || !userId) {
      showCustomError("App not ready. Please wait.");
      return;
    }

    const recipeData = editingRecipe || newRecipe;

    if (!recipeData.name || !recipeData.brand || !recipeData.baseProfile) {
        showCustomError("Please fill in Recipe Name, Brand, and Base Profile.");
        return;
    }
    
    const validProfiles = BASE_PROFILES_BY_BRAND[recipeData.brand] || [];
    if (!validProfiles.includes(recipeData.baseProfile)) {
        showCustomError("Invalid Base Profile selected for the chosen brand.");
        return;
    }

    try {
      // 1. Prepare data
      const submissionData = {
        ...recipeData,
        // These fields are only set on creation
        ...(editingRecipe ? {} : { userId, endorserIds: [], timestamp: serverTimestamp() })
      };
      
      if (editingRecipe) {
        // EDIT MODE: Update existing document
        // Destructure the original ID and metadata before sending the clean payload
        const { id, endorserIds, userId: ownerId, timestamp, ...dataToUpdate } = submissionData;
        const recipeDocRef = doc(db, RECIPES_COLLECTION_PATH, editingRecipe.id);
        
        await updateDoc(recipeDocRef, dataToUpdate);
        showCustomError("Recipe updated successfully!");
      } else {
        // ADD MODE: Create new document
        // CRUCIAL FIX: Create a shallow copy and delete the ID property 
        // to ensure Firestore accepts the payload for a new document.
        const dataToSave = Object.assign({}, submissionData);
        delete dataToSave.id; 

        await addDoc(collection(db, RECIPES_COLLECTION_PATH), dataToSave);
        showCustomError("Recipe published successfully!");
      }

      resetFormState();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      console.error("Submission Error:", err);
      showCustomError("Failed to submit. Ensure your data is valid.");
    }
  };

  // Logic to show form when editingRecipe state is set
  useEffect(() => {
    if (editingRecipe) {
      setIsFormVisible(true);
      setSelectedRecipe(null); // Close detail modal if open
    }
  }, [editingRecipe]);

  if (loading) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-gray-50">
        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-[#FF654F]"></div>
      </div>
    );
  }

  return (
    <React.Fragment>
      
      <div className="min-h-screen bg-gray-50 font-sans text-gray-800 pb-20">
        
        <header className="sticky top-0 z-20 bg-white/90 backdrop-blur shadow-sm border-b border-gray-200">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div className="flex items-center">
              <div className="bg-[#FF654F] p-2 rounded-lg mr-3">
                  <BookOpen className="w-5 h-5 text-white" />
              </div>
              <h1 className="text-2xl font-black tracking-tight text-gray-900">
                {/* LOGIC FOR SITE TITLE COLORING: The Recipe Book */}
                {SITE_TITLE.split(' ').map((word, index) => (
                    <span key={index} className={index === 1 ? 'text-[#FF654F]' : ''}> 
                        {word}{' '}
                    </span>
                ))}
                
                {/* Version link prep */}
                <a href="#v0.8.006" className="ml-2 text-[10px] font-medium bg-[#FF654F]/20 text-[#FF654F] px-1.5 py-0.5 rounded border border-[#FF654F]/30 hover:bg-[#FF654F]/30 transition">v0.8.006</a>
              </h1>
            </div>
            <div className="flex space-x-3 items-center">
               <div className="text-xs text-gray-500 hidden sm:block">User ID: <span className="font-mono font-semibold text-gray-700">{userId || 'N/A'}</span></div>
               
               {/* Settings Button (Opens Debug Screen) */}
                 <button 
                    onClick={() => setIsDebugMenuOpen(true)}
                    className="p-2 rounded-full text-gray-700 hover:bg-gray-100 transition"
                    title="Debug & Settings"
                 >
                    <Settings className="w-5 h-5" />
                 </button>

               <button 
                  onClick={() => {setEditingRecipe(null); setIsFormVisible(true); setSelectedRecipe(null);}}
                  className="bg-gray-900 text-white px-4 py-2 rounded-full text-sm font-semibold hover:bg-gray-800 transition flex items-center shadow-md"
               >
                 <PlusCircle className="w-4 h-4 mr-2" />
                 New Recipe
               </button>
            </div>
          </div>
        </header>
        
        {error && (
          <div className="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 bg-red-500 text-white rounded-full shadow-xl text-sm font-medium animate-bounce">
            {error}
          </div>
        )}

        <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
          
          {/* Search & Filter Bar */}
          <div className="flex flex-col md:flex-row gap-4 mb-8">
            <div className="relative flex-1">
              <Search className="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5" />
              <input
                type="text"
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                placeholder="Search recipes, models, or tags..."
                className="w-full pl-12 pr-4 py-3 rounded-xl border-none bg-white shadow-sm focus:ring-2 focus:ring-[#FF654F]"
              />
            </div>
            <div className="flex gap-2 overflow-x-auto pb-2 md:pb-0 hide-scrollbar">
              <button 
                  onClick={() => setFilterBrand('All')}
                  className={`px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors ${filterBrand === 'All' ? 'bg-gray-800 text-white' : 'bg-white text-gray-600 hover:bg-gray-100'}`}
              >
                  All Brands
              </button>
              {ALL_BRANDS.map(brand => (
                  <button 
                      key={brand}
                      onClick={() => setFilterBrand(brand)}
                      className={`px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors ${filterBrand === brand ? 'bg-[#FF654F] text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-100'}`}
                  >
                      {brand}
                  </button>
              ))}
              <button 
                  onClick={() => setFilterBrand('Favorites')}
                  className={`flex items-center px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition-colors ${filterBrand === 'Favorites' ? 'bg-gray-800 text-white shadow-md' : 'bg-white text-gray-600 hover:bg-gray-100'}`}
              >
                  <Bookmark className="w-4 h-4 mr-1.5" fill={filterBrand === 'Favorites' ? 'white' : 'currentColor'}/>
                  Bookmarks ({favoriteRecipeIds ? favoriteRecipeIds.size : 0})
              </button>
            </div>
          </div>

          {/* Recipe Form Modal */}
          <RecipeForm
            recipeData={editingRecipe || newRecipe}
            isVisible={isFormVisible}
            onClose={resetFormState}
            onSubmit={handleFormSubmit}
            onInputChange={handleInputChange}
            onBrandChange={handleBrandChange}
            onImageUpload={handleImageUpload}
            onClearImage={clearImage}
            isProcessingImage={isProcessingImage}
            fileInputRef={fileInputRef} // PASS REF HERE
          />
          
          {/* Debug Screen Modal */}
          <DebugScreen 
            isVisible={isDebugMenuOpen}
            onClose={() => setIsDebugMenuOpen(false)}
            handleDeleteAllRecipes={handleDeleteAllRecipes}
            userId={userId} // PASS USER ID HERE
          />
          
          {/* Detail View Modal */}
          <RecipeDetailModal
              recipe={selectedRecipe}
              isVisible={!!selectedRecipe}
              onClose={() => setSelectedRecipe(null)}
              userId={userId}
              toggleFavorite={toggleFavorite}
              toggleEndorsement={toggleEndorsement}
              setEditingRecipe={setEditingRecipe}
              handleDeleteRecipe={handleDeleteRecipe}
          />


          {/* Grid Content */}
          <a id="v0.8.006"></a> {/* Anchor for version tracking */}
          {filteredRecipes.length === 0 ? (
              <div className="flex flex-col items-center justify-center py-20 text-center bg-white rounded-3xl border border-gray-100 shadow-sm">
                  <div className="bg-gray-100 p-4 rounded-full mb-4">
                      <ImageIcon className="w-8 h-8 text-gray-400" />
                  </div>
                  <h3 className="text-lg font-medium text-gray-900">
                      {filterBrand === 'Favorites' ? "You haven't bookmarked any recipes yet." : "No recipes found"}
                  </h3>
                  <p className="text-gray-500 max-w-sm mt-2">Try adjusting your search or filters, or be the first to contribute.</p>
              </div>
          ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                {filteredRecipes.map(recipe => (
                  <RecipeCard 
                    key={recipe.id} 
                    recipe={recipe} 
                    userId={userId}
                    isFavorite={favoriteRecipeIds.has(recipe.id)}
                    toggleFavorite={toggleFavorite}
                    toggleEndorsement={toggleEndorsement}
                    setEditingRecipe={setEditingRecipe}
                    handleDeleteRecipe={handleDeleteRecipe}
                    setSelectedRecipe={setSelectedRecipe} // Pass state setter
                  />
                ))}
              </div>
          )}
          
        </main>
      </div>
    </React.Fragment>
  );
}
    // END PASTE BLOCK
    
    // RENDER APP
    document.addEventListener('DOMContentLoaded', () => {
      ReactDOM.render(
          <App />,
          document.getElementById('root')
      );
    });
    </script>
</body>
</html>
